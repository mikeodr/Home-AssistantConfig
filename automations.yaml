- id: '1776537959490'
  alias: Basement Music Control
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - event.bilresa_dual_button_button_1
    id: Back
  - trigger: state
    entity_id:
    - event.bilresa_dual_button_button_2
    id: Forward
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Back
      sequence:
      - action: media_player.media_previous_track
        metadata: {}
        target:
          entity_id: media_player.sonos_basement
        data: {}
    - conditions:
      - condition: trigger
        id:
        - Forward
      sequence:
      - action: media_player.media_next_track
        metadata: {}
        target:
          entity_id: media_player.sonos_basement
        data: {}
  mode: single
