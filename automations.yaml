- id: '1778354504167'
  alias: Garage Battery Charger
  description: ''
  use_blueprint:
    path: Blackshome/battery-charger-notifications.yaml
    input:
      charger_switch: switch.garage_battery
      trigger_options:
      - button_trigger_enabled
      power_sensor: sensor.garage_battery_power
      button_trigger: input_button.charge_batteries
      include_start_notify: enable_start_notify_options
      start_notify_device:
      - 0f1add8ea641663a2bd8ac41e3f65e77
      start_notify_tag: garage-batteries
      start_notify_interruption_level: time-sensitive
      include_end_notify: enable_end_notify_options
      end_notify_device:
      - 0f1add8ea641663a2bd8ac41e3f65e77
      end_notify_tag: garage-batteries
      end_notify_interruption_level: time-sensitive
      include_entity_off_end_option: entity_off_enabled
      entity_off_end:
      - switch.garage_battery
