- id: '1793216599032'
  alias: SolarEdge Failure Notification
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.solaredge_se7600h_problem
    to:
    - 'on'
    id: generated-V492
  - trigger: state
    entity_id:
    - binary_sensor.solaredge_se7600h_problem
    to:
    - 'off'
    id: generated-CBHF
  conditions: []
  actions:
  - choose:
    - conditions: []
      sequence: []
    - conditions:
      - condition: trigger
        id:
        - generated-V492
      sequence:
      - action: notify.mobile_app_michaels_iphone
        metadata: {}
        data:
          message: SolarEdge Production failed
    - conditions:
      - condition: trigger
        id:
        - generated-CBHF
      sequence:
      - action: notify.mobile_app_michaels_iphone
        metadata: {}
        data:
          message: SolarEdge production restored
  mode: single
