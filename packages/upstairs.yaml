automation:
  - alias: Evening Convenience Control
    id: upstairs_evening_convenience_control
    mode: single
    max_exceeded: silent
    trigger:
      # Main Bath
      - trigger: device
        domain: mqtt
        device_id: 24606a2c9bf2c14af2ad0305265c97e6
        type: action
        subtype: down_double
      # Main Stairs
      - trigger: device
        domain: mqtt
        device_id: 0d619322f1e8664e17f93285090c18bd
        type: action
        subtype: down_double
      # Upstairs Hall
      - trigger: device
        domain: mqtt
        device_id: 67df18469d484ee9d7870f2a5fb692cb
        type: action
        subtype: down_double
    condition:
      - condition: time
        after: "21:00:00"
        before: "04:00:00"
    actions:
      - event: goodnight_event

  - alias: Close Stairs Blinds at Girls Bedtime
    id: 56d26278-744b-4383-9b91-600fb8bbcc39
    triggers:
      - platform: time
        at: "19:00:00"
      - platform: sun
        event: sunset
    actions:
      - service: cover.close_cover
        target:
          entity_id: 
            - cover.stairs_covers
            - cover.main_bedroom_cover_right
      - if:
          - condition: state
            entity_id: binary_sensor.main_bedroom_window_contact
            state: "off"
        then:
          - service: cover.close_cover
            target:
              entity_id: cover.main_bedroom_cover_left
      - if:
          - condition: state
            entity_id: binary_sensor.front_bedroom_window_contact
            state: "off"
        then:
          - service: cover.close_cover
            target:
              entity_id: cover.front_bedroom_cover
      - service: cover.close_cover
        entity_id:
          - cover.main_bath_cover
          - cover.girls_bathroom_cover
