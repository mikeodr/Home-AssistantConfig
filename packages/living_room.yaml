  - alias: Open shades for convection heat effect
    id: 61de7dfe-62ed-4592-8bbb-e36718d9a794
    triggers:
      - platform: time
        at: "07:15:00"
    actions:
      - service: cover.set_cover_position
        data:
          position: 5
        target:
          entity_id: cover.living_room_shades

  - alias: Close shades for nighttime
    id: 3a1aa06e-390a-4a10-821b-f23f7e211087
    triggers:
      - platform: time
        at: "22:30:00"
    actions:
      - service: cover.close_cover
        entity_id:
          # - cover.living_room_shades
          - cover.powder_room_cover
