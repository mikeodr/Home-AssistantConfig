template:
  - sensor:
      - name: Current Hydro Time of Use State
        unique_id: energy_hydro_tou_state
        icon: mdi:transmission-tower
        state: >-
          {# Ultra-Low Overnight: 11 PM to 7 AM all days #}
          {% if now().hour < 7 or now().hour >= 23 %}
            Ultra-Low Overnight
          {# Weekends and Holidays: 7 AM to 11 PM #}
          {% elif states('binary_sensor.workday_sensor') == 'off' %}
            Weekend Off-peak
          {# Weekdays #}
          {% elif now().hour >= 7 and now().hour < 16 %}
            Mid-peak
          {% elif now().hour >= 16 and now().hour < 21 %}
            On-peak
          {% elif now().hour >= 21 and now().hour < 23 %}
            Mid-peak
          {% endif %}

      - name: Current Hydro TOU Rate
        unique_id: energy_hydro_tou_rate
        icon: mdi:currency-usd
        unit_of_measurement: CAD/kWh
        state: >-
          {% if states('sensor.current_hydro_time_of_use_state') == 'Ultra-Low Overnight' %}
            {{ states('sensor.enova_hydro_ultra_low_overnight') }}
          {% elif states('sensor.current_hydro_time_of_use_state') == 'Weekend Off-peak' %}
            {{ states('sensor.enova_hydro_weekend_off_peak_rate') }}
          {% elif states('sensor.current_hydro_time_of_use_state') == 'Mid-peak' %}
            {{ states('sensor.enova_hydro_mid_peak_rate') }}
          {% elif states('sensor.current_hydro_time_of_use_state') == 'On-peak' %}
            {{ states('sensor.enova_hydro_on_peak_rate') }}
          {% endif %}

sensor:
  - platform: rest
    name: Enova Hydro Ultra Low Overnight
    unique_id: 5536daee-8d28-4e84-81cd-6a2cf650eb20
    icon: mdi:currency-usd
    resource: https://www.oeb.ca/_html/calculator/data/BillData.xml
    unit_of_measurement: CAD/kWh
    value_template: >-
      {% set data = value_json['BillDataTable']['BillDataRow'] %}
      {{ data | selectattr('Dist', 'eq', 'Enova Power Corp.-Kitchener-Wilmot Hydro Rate Zone') | map(attribute='ULO_overnight') | first }}
