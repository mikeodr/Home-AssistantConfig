automation:
  - alias: Enable Media Power from switches
    id: 09f3ceb2-4782-4385-bc78-d2f3827eb73d
    trigger:
      # Deck light switch
      - trigger: device
        domain: mqtt
        device_id: cffa3ef7848f9e2b8688eea2a1fe4f28
        type: action
        subtype: config_double
      # Kitchen Light switch
      - trigger: device
        domain: mqtt
        device_id: e97867a8181f2b6c5aef264706584f91
        type: action
        subtype: config_double
      # Living room light switch
      - trigger: device
        domain: mqtt
        device_id: c2fce543d85f8ffccd89691a42f784d9
        type: action
        subtype: config_double
    action:
      - service: switch.turn_on
        entity_id: switch.entertainment_switch_relay

  - alias: Save media power when not home
    id: media_energy_saver_not_home
    trigger:
      - platform: state
        entity_id: alarm_control_panel.alarmo
        to:
          - armed_night
          - armed_vacation
        id: power_off
      - platform: state
        entity_id: sensor.current_hydro_time_of_use_state
        to:
          - Mid-peak
          - On-peak
        from:
          - Ultra-Low Overnight
          - Weekend Off-peak
        id: power_off
      - platform: state
        entity_id: alarm_control_panel.alarmo
        to:
          - armed_away
        for:
          minutes: 30
        id: power_off
      - platform: state
        entity_id: alarm_control_panel.alarmo
        to: disarmed
        not_from: triggered
        id: power_on
      - platform: state
        entity_id: sensor.current_hydro_time_of_use_state
        to:
          - Ultra-Low Overnight
          - Weekend Off-peak
        id: power_on
      - platform: state
        entity_id: schedule.tv_power
        to: "on"
        id: power_on
    conditions:
      - condition: template
        value_template: "{{ now().date() > (states('input_datetime.holidays_end') | as_datetime | as_local).date() }}"
    actions:
      choose:
        - conditions:
            - condition: trigger
              id: power_off
            - not:
                - condition: state
                  entity_id: media_player.apple_tv_living_room
                  state: "playing"
                - condition: state
                  entity_id: media_player.living_room_tv
                  state: "on"
          sequence:
            - service: homeassistant.turn_off
              entity_id: switch.entertainment_switch_relay
        - conditions:
            - condition: trigger
              id: power_on
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: disarmed
            - or:
                - condition: state
                  entity_id: schedule.tv_power
                  state: "on"
                - condition: state
                  entity_id: calendar.ontario_holidays
                  state: "on"
          sequence:
            - service: homeassistant.turn_on
              entity_id: switch.entertainment_switch_relay
  
  - alias: Save power on accessories when not home
    id: 841b496e-7678-43a8-9544-e6046a86fa74
    trigger:
      - platform: state
        entity_id: alarm_control_panel.alarmo
        to:
          - armed_night
          - armed_vacation
    actions:
      - service: switch.turn_off
        entity_id: switch.paper_printer_power

  - alias: Save powerwall on holidays
    id: energy_save_powerwall_on_holidays
    triggers:
      - platform: state
        entity_id: schedule.holiday_powerwall
        to: "on"
        id: "son"
      - platform: state
        entity_id: schedule.holiday_powerwall
        to: "off"
    conditions:
      - condition: state
        entity_id: calendar.ontario_holidays
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: "son"
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.home_backup_reserve
                data:
                  value: 100
              - service: notify.mobile_app_michaels_iphone
                data:
                  message: "Powerwall set for holidays"
                  data:
                    tag: "powerwall"
                    group: "energy"
        default:
          - service: number.set_value
            target:
              entity_id: number.home_backup_reserve
            data:
              value: 20
          - service: notify.mobile_app_michaels_iphone
            data:
              message: "Powerwall holidays off"
              data:
                tag: "powerwall"
                group: "energy"

  - alias: Save power on grid outage
    id: 25af6c2e-619d-4aed-bd30-3b75194767f0
    triggers:
      - platform: state
        entity_id: binary_sensor.home_grid_status
        from: "on"
        to: "off"
        id: power_loss
      - platform: state
        entity_id: binary_sensor.home_grid_status
        from: "off"
        to: "on"
        id: power_restore
    actions:
      - alias: "choose alias (name)"
        choose:
        - conditions:
            - condition: trigger
              id: power_loss
          sequence:
            - service: homeassistant.turn_off
              target:
                entity_id:
                  - switch.basement_space_heater
                  - switch.hrv_power
            - service: light.turn_off
              target:
                entity_id:
                  - light.exterior_lights
            - service: notify.mobile_app_michaels_iphone
              data:
                message: "⚡ Power lost - turning off non-essential devices ⚡"
                data:
                  tag: "power_loss"
                  group: "energy"
        - conditions:
            - condition: trigger
              id: power_restore
          sequence:
            - service: homeassistant.turn_on
              target:
                entity_id:
                  - switch.hrv_power
            - service: notify.mobile_app_michaels_iphone
              data:
                title: "⚡ Power restored - resuming normal operation ⚡"
                message: "Re-enable HRV manually"
                data:
                  tag: "power_restore"
                  group: "energy"

  - alias: Powerwall Low
    id: 1f1e8b8a-77fb-4875-bcbb-c2f7da4d03f2
    trigger:
      - platform: numeric_state
        entity_id: sensor.home_percentage_charged
        below: 22
    action:
      - service: notify.mobile_app_michaels_iphone
        data:
          message: "🪫 Powerwall low - {{ states('sensor.home_percentage_charged') }} 🪫"
          data:
            tag: "powerwall-low"
            group: "energy"

  - alias: Turn off cooling when Powerwall low
    id: c1531db5-93ed-4598-822d-bed1df32c734
    triggers:
      - platform: numeric_state
        entity_id: sensor.home_percentage_charged
        below: 25
      - platform: state
        entity_id: binary_sensor.home_grid_status
        to: "off"
    conditions:
      - condition: state
        entity_id: binary_sensor.home_grid_status
        state: "off"
      - condition: numeric_state
        entity_id: sensor.home_percentage_charged
        below: 25
      - condition: state
        entity_id: climate.my_ecobee
        state: "cool"
    actions:
      - service: climate.turn_off
        target:
          entity_id: climate.my_ecobee
      - service: notify.mobile_app_michaels_iphone
        data:
          message: "Powerwall at {{ states('sensor.home_percentage_charged') }}% - thermostat turned off"
          data:
            tag: "powerwall-cooling"
            group: "energy"

  - alias: Pause Powerwall if Car Charging
    id: 5e22ec2c-43a2-4286-ab58-f5235bedd8ad
    triggers:
      - platform: state
        entity_id: sensor.sparky_charging
        to: "charging"
        id: "charging"
      - platform: state
        entity_id: sensor.sparky_charging
        to:
          - "stopped"
          - "copmlete"
          - "disconnected"
        not_from:
          - "disconnected"
          - "unavailable"
          - "complete"
        id: "not_charging"
      - platform: time
        at: "23:00:00"
        id: "not_charging"
    conditions:
      - condition: state
        entity_id: device_tracker.sparky_location
        state: "home"
    actions:
      choose:
        - conditions:
            - condition: trigger
              id: charging

            - not:
                - condition: state
                  entity_id: sensor.current_hydro_time_of_use_state
                  state: "Ultra-Low Overnight"
          sequence:
            - service: notify.mobile_app_michaels_iphone
              data:
                message: "⚡ Car charging - pausing Powerwall backup reserve ⚡"
                data:
                  tag: "sparky-charging"
                  group: "energy"
            - service: number.set_value
              entity_id: number.home_backup_reserve
              data:
                value: "{{ states('sensor.home_percentage_charged') | int }}"
        - conditions:
            - condition: trigger
              id: not_charging
          sequence:
            - if:
                - condition: numeric_state
                  entity_id: number.home_backup_reserve
                  above: 20
              then:
                - service: notify.mobile_app_michaels_iphone
                  data:
                    message: "Car not charging - resuming Powerwall backup reserve"
                    data:
                      tag: "sparky-charging"
                      group: "energy"
            - service: number.set_value
              entity_id: number.home_backup_reserve
              data:
                value: 20
