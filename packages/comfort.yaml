automation:
  - alias: Update Outside Min Temp Next 8h
    id: 90a8c803-be94-4c12-b217-3269a3994d67
    trigger:
      - platform: time_pattern
        minutes: "/30"
      - platform: homeassistant
        event: start
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.tomorrow_io_home_nowcast
        data:
          type: hourly
        response_variable: forecast
      - variables:
          temps: "{{ forecast['weather.tomorrow_io_home_nowcast'].forecast | map(attribute='temperature') | list }}"
          min_temp: "{{ temps[:8] | min | default(0) | round(1) }}"
      - action: input_number.set_value
        data:
          value: "{{ min_temp }}"
        target:
          entity_id: input_number.outside_min_temperature_next_8_hours

  - alias: Disable Climate If Door or Window Ajar
    id: disable_climate_door_ajar
    trigger:
      - platform: state
        id: "notification_door_open"
        entity_id:
          - binary_sensor.doors
          - binary_sensor.windows
        to: "on"
        for:
          minutes: 5
    condition:
      - not:
          - condition: state
            entity_id: climate.my_ecobee
            state: "off"
    action:
      - variables:
          action_turn_off: "TURN_OFF_CLIMATE_{{ context.id }}"
      - service: notify.mobile_app_michaels_iphone
        data:
          title: "A Door or window has been left open"
          message: "Adjusting thermostat"
          data:
            tag: "front-door-open-warning"
            push:
              interruption-level: critical
            actions:
              - action: "{{ action_turn_off }}"
                title: "Turn Off Thermostat"
                activationMode: "background"
                authenticationRequired: true
                destructive: true
                behavior: "default"
      - choose:
          - conditions:
              - condition: state
                entity_id: climate.my_ecobee
                state:
                  - "heat"
                  - "cool"
            sequence:
              - action: climate.set_temperature
                data:
                  temperature: >
                    {% if is_state('climate.my_ecobee', 'cool') %}
                      {{ state_attr('climate.my_ecobee', 'temperature') | float + 5 }}
                    {% else %}
                      {{ state_attr('climate.my_ecobee', 'temperature') | float - 5 }}
                    {% endif %}
                target:
                  entity_id: climate.my_ecobee
          - conditions:
              - condition: state
                entity_id: climate.my_ecobee
                state: "heat_cool"
            sequence:
              - action: climate.set_temperature
                data:
                  target_temp_low: "{{ state_attr('climate.my_ecobee', 'target_temp_low') | float - 5 }}"
                  target_temp_high: "{{ state_attr('climate.my_ecobee', 'target_temp_high') | float + 5 }}"
                target:
                  entity_id: climate.my_ecobee
      - wait_for_trigger:
          - platform: template
            value_template: >
              {{ is_state('binary_sensor.doors', 'off') and is_state('binary_sensor.windows', 'off') }}
          - platform: event
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_turn_off }}"
      - if:
          - condition: template
            value_template: >
              {{ wait.trigger is not none
                 and wait.trigger.platform == 'event'
                 and wait.trigger.event is not none
                 and wait.trigger.event.data is not none
                 and wait.trigger.event.data.action == action_turn_off }}
        then:
          - action: button.press
            entity_id: button.my_ecobee_clear_hold
          - action: climate.set_hvac_mode
            data:
              hvac_mode: "off"
            target:
              entity_id: climate.my_ecobee
      - action: button.press
        entity_id: button.my_ecobee_clear_hold
      - service: notify.mobile_app_michaels_iphone
        data:
          message: "clear_notification"
          data:
            tag: "front-door-open-warning"

  - alias: Furnace on if left off and cold forecast
    id: furnace_on_if_left_off_cold_forecast
    trigger:
      - platform: time
        at: "22:00:00"
      - platform: time
        at: "00:00:00"
    condition:
      - condition: state
        entity_id: climate.my_ecobee
        state:
          - "off"
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.tomorrow_io_home_nowcast
        data:
          type: hourly
        response_variable: forecast
      - condition: template
        value_template: "{{ forecast['weather.tomorrow_io_home_nowcast'].forecast | map(attribute='temperature')| list | min < 10 }}"
      - service: notify.mobile_app_michaels_iphone
        data:
          message: "Furnace enabled, cold weather forecast"
          data:
            tag: "furnace-enabled-cold-notification"
            group: "furnace-notification"
      - service: climate.set_hvac_mode
        data:
          hvac_mode: heat
        target:
          entity_id: climate.my_ecobee

  - alias: CO2 High Notification
    id: comfort_co2_high_notification
    trigger:
      - platform: numeric_state
        entity_id: sensor.airthings_wave_111512_carbon_dioxide
        above: 950
        for:
          hours: 1
    condition:
      - condition: state
        entity_id: group.adults
        state: "home"
    action:
      - service: notify.mobile_app_michaels_iphone
        data:
          message: "CO2 is high, is HRV on?"
          data:
            url: /lovelace/air-quality
            clickAction: /lovelace/air-quality
            tag: "comfort-co2-high-notification"
  
  - alias: Radon Level Alert
    id: 334562ed-90a7-4979-b0be-509a34e37cb7
    triggers:
      - platform: state
        entity_id:
          - sensor.airthings_wave_111512_radon_1_day_level
          - sensor.airthings_wave_111512_radon_longterm_level
        from: "good"
        not_to:
          - unavailable
          - unknown
    actions:
      - service: notify.mobile_app_michaels_iphone
        data:
          message: "☢️ Check Radon levels ☢️"
