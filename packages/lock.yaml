automation:
  - alias: Lock Status Change
    id: lock_status_change
    trigger:
      - platform: event
        event_type: zwave_js_notification
        event_data:
          command_class: 113
          type: 6
          event: 6
    condition:
      - condition: state
        entity_id: person.mike
        state: "not_home"
    action:
      service: notify.mobile_app_michaels_iphone
      data:
        title: "Lock Event"
        message: >
          {% set user_slot = trigger.event.data.parameters.userId %}
          {% if user_slot == 1 %}
          {% set user = "Mike" %}
          {% elif user_slot == 2 %}
          {% set user = "Dad" %}
          {% elif user_slot == 3 %}
          {% set user = "Brendan" %}
          {% elif user_slot == 4 %}
          {% set user = "Tiff" %}
          {% elif user_slot == 5 %}
          {% set user = "Lisa" %}
          {% elif user_slot == 15 %}
          {% set user = "Cleaners" %}
          {% endif %}
          Unlocked{% if user is defined %} by {{user}}{% endif %}
      #{{ trigger.to_state.attributes.friendly_name }} is {{ trigger.to_state.state }}{% if user is defined %} by {{user}}{% endif %}

  - alias: Secure House Evenings
    id: lock_secure_house_evenings
    trigger:
      - platform: time
        at: "22:30:00"
      - platform: state
        entity_id:
          - lock.locks
        to: "unlocked"
        for:
          minutes: 5
    condition:
      condition: time
      after: "22:25:00"
      before: "07:00:00"
    action:
      - parallel:
          - sequence:
              - wait_template: "{{ is_state('binary_sensor.front_door', 'off') }}"
              - service: lock.lock
                entity_id: lock.front_door
          - sequence:
              - wait_template: "{{ is_state('binary_sensor.side_door_open', 'off') }}"
              - service: lock.lock
                entity_id: lock.side_door

  - alias: Lock doors when nearby but not on wifi
    id: lock_secure_house_nearby_but_offline
    trigger:
      - platform: state
        entity_id:
          - device_tracker.mike_iphone
          - device_tracker.tiffanys_iphone_unifi
        to: "not_home"
        for:
          minutes: 10
    condition:
      - condition: state
        entity_id: group.adults
        state: "home"
      - condition: state
        entity_id:
          - device_tracker.mike_iphone
          - device_tracker.tiffanys_iphone_unifi
        state: "not_home"
      - condition: state
        entity_id: lock.locks
        state: "unlocked"
    action:
      - service: notify.mobile_app_michaels_iphone
        data:
          message: "Wifi Auto Lock Triggered"
      - service: lock.lock
        entity_id: lock.locks
