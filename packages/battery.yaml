automation:
  - alias: "Battery Low Persistent Notification"
    id: 1d3287f8-be9b-4283-842f-4441d8c62531
    mode: queued
    variables:
      ignored_devices: []
    triggers:
      - trigger: event
        event_type: battery_notes_battery_threshold
        event_data:
          battery_low: true
        id: low
      - trigger: event
        event_type: battery_notes_battery_threshold
        event_data:
          battery_low: false
        id: high
    actions:
      - condition: template
        value_template: >
          {{ ignored_devices is none or ignored_devices | length == 0
          or trigger.event.data.device_id not in ignored_devices }}
      - choose:
          - conditions:
              - condition: trigger
                id: low
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: "battery_notes_{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id }}"
                  title: "{{ trigger.event.data.device_name }} Battery Low"
                  message: >
                    Battery level is {{ trigger.event.data.battery_level }}%.
                    Requires {{ trigger.event.data.battery_quantity }}×
                    {{ trigger.event.data.battery_type }} battery.
          - conditions:
              - condition: trigger
                id: high
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "battery_notes_{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id }}"
